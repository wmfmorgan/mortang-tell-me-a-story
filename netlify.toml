# Skip Netlify builds when nothing under the Flutter web app (or this file) changed.
# Exit 0 = cancel build; exit 1 = continue.
# Docs / CI / supabase-only / e2e-only commits → skipped.
# https://docs.netlify.com/build/configure-builds/ignore-builds/

[build]
  ignore = """
if [ -z "$CACHED_COMMIT_REF" ]; then
  exit 1
fi
git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- \
  apps/tell_me_a_story/ \
  netlify.toml
"""