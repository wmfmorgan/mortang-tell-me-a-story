name: tell_me_a_story_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.12.2'


dependencies:
  crypto: ^3.0.6
  http: ^1.6.0
  serverpod: 4.1.1
  serverpod_auth_idp_server: 4.1.1
  serverpod_cloud_storage_gcp: 4.1.1
dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.1.1
  test: ^1.25.5

# sqlite3 is a transitive dependency of serverpod_database (its SQLite
# adapter). This server only uses Postgres, so don't download a prebuilt
# libsqlite3 from GitHub releases at build time; resolve it from the process
# only if something ever opens a SQLite database.
hooks:
  user_defines:
    sqlite3:
      source: process
