### A story with everything the timeline and reader show.
class: StoryDto
fields:
  id: UuidValue
  familyId: UuidValue
  authorId: UuidValue?
  title: String?
  body: String?
  dateStart: DateTime?
  dateEnd: DateTime?
  datePrecision: DatePrecision?
  createdAt: DateTime
  placeId: UuidValue?
  placeLabel: String?
  placeAddress: String?
  status: StoryStatus
  publishedAt: DateTime?
  people: List<StoryPersonDto>
  photos: List<PhotoRefDto>
  authorName: String?
  authorAvatarKey: String?
  commentCount: int
  perspectiveCount: int
